# QX Cas - which unseen third bodies can tilt the 6-d pair at the observed rate? Ensemble around 1980.6 (t = 0 =
# BJD 2444500): the pair as in qx_cas_published.yaml (i = 82 deg), the third body drawn from wide priors (P3 30 d -
# 30 yr, m3 0.3-6 Msun, any orientation, e3 0-0.6). Observables: the inclination at t = 0 (82 +- 1.5) and its rate
# (85.4 deg in 1960 -> 75 in 2005: -0.23 +- 0.08 deg/yr, central rate over +-15 yr). Result: the accepted (P3, m3, J)
# family - which third bodies explain the vanished eclipses, and when the eclipses return.
# NOTE: the pair uses omega = 117 deg of the first version of qx_cas_published.yaml (now 30 deg, which matches the
#   secondary minima); the observables here are only the inclination and its rate, kept unchanged with the results.
topology: custom
hierarchy: {out: [inner, m3], inner: [m1, m2]}
masses: {m1: 5.5, m2: 6.5, m3: 3.0}
orbits:
  inner: {P: 6.0039521, e: 0.21, i: 82.0, Omega: -8.54, omega: 117.0, M0: 313.41}
  out:   {P: 300.0,   e: 0.2,  i: 69.37, Omega: 2.44, omega: 0.0,   M0: 0.0}
stars:
  m1: {R: 3.5, Teff: 24000}
  m2: {R: 5.1, Teff: 18000}
  m3: {R: 2.0, Teff: 12000}
stellar_model: {kind: mist, age_myr: 60.0, feh: 0.0, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 30, n_output: 3001, extremes_every_orbits: 20}
ensemble:
  n: 2000
  seed: 1960
  directions: [forward, backward]
  vary:
    masses.m3: {loguniform: [0.3, 6.0]}    # NGC 7790 is ~60 Myr old: heavier stars have evolved off the MIST tracks
    orbits.out.P: {loguniform: [30.0, 11000.0]}
    orbits.out.e: {uniform: [0.0, 0.6]}
    orbits.out.i: isotropic
    orbits.out.Omega: angle
    orbits.out.omega: angle
    orbits.out.M0: angle
  require: [stable_ma01]
  observed:
    inner_i0: {value: 82.0, sigma: 1.5}
    inner_didt0_deg_yr: {value: -0.23, sigma: 0.08}
    "backward:fate": {equals: intact}
    "forward:fate": {equals: intact}
