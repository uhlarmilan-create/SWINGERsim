# Campaign "open questions", study S1a: V907 Sco - the spin of the eclipsing pair over 2000 yr.
# The published solution (configs/squadra_test3/v907_sco_published.yaml: Zasche et al. 2023, AJ 165, 81) with
# synchronous, initially aligned spins. Question: the spin of m1 tilts from 0 to ~100 deg against its orbit while the
# mutual inclination of the orbits is only 26 deg. The spin precession (rotational and tidal bulge, period ~36 yr) and
# the nodal precession of the pair (63 yr) are nearly equal: eta = g / alpha ~ 0.58 against the Cassini-state
# bifurcation at eta_crit ~ 0.59 (Felce & Fuller 2023; Anderson, Lai & Storch 2017: the trans-adiabatic regime).
# Output: obliquities and spin vectors (stars/<m>/spin_x,y,z, the frame of the inclinations) for the projected
# spin-orbit angle of a Rossiter-McLaughlin measurement during the present eclipse window (to ~2052).
topology: custom
hierarchy: {out: [inner, m3], inner: [m1, m2]}
masses: {m1: 2.56, m2: 2.74, m3: 1.06}
orbits:
  inner: {P: 3.7747839, e: 0.008, i: 76.61, Omega: 17.27, omega: 122.6, M0: 43.95}
  out:   {P: 142.01,    e: 0.467, i: 68.80, Omega: -8.97, omega: 22.7,  M0: 40.7}
stars:
  m1: {R: 2.53, Teff: 10004}
  m2: {R: 2.68, Teff: 10000}
  m3: {R: 1.00, Teff: 5900}
stellar_model: {kind: mist, age_myr: 400.0, feh: 0.0, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}

run: {t_max_yr: 2000, n_output: 8001, extremes_every_orbits: 50}
