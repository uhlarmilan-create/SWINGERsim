# Training set for the machine-learning chapter of the manual (docs: Machine learning):
# the CzeV4315-like 2+2 of configs/squadra/czev4315_ensemble.yaml, forward only, 5000 members,
# secular backend. Used to train an emulator and a simulation-based-inference network.
topology: 2+2
masses:
  m1: 2.4
  m2: 2.09
  m3: 2.3
  m4: 2.35
orbits:
  A:
    P: 6.73907
    e: 0.64
    i: 87.44
    Omega: 0.0
  B:
    P: 0.9193238
    e: 0.0
    i: 63.4
  out:
    P: 300.0
    e: 0.3
    i: 90.0
stars:
  m1:
    R: 1.73
  m2:
    R: 1.63
  m3:
    R: 1.83
  m4:
    R: 1.81
physics:
  gr: true
  tides: true
run:
  t_max_yr: 300
  n_output: 301
  backend: secular
ensemble:
  n: 5000
  seed: 2026
  directions:
  - forward
  require:
  - stable_v22
  vary:
    orbits.A.i:
      normal:
      - 87.44
      - 0.21
      max: 90.0
    orbits.A.omega: angle
    orbits.B.i:
      normal:
      - 63.4
      - 0.4
      mirror: true
    orbits.B.Omega: angle
    orbits.out.P:
      loguniform:
      - 40.0
      - 3000.0
    orbits.out.e:
      uniform:
      - 0.0
      - 0.7
    orbits.out.i: isotropic
    orbits.out.Omega: angle
    orbits.out.omega: angle
  observed:
    B_dtiltdt0_deg_yr:
      value: -1.4
      sigma: 0.2
