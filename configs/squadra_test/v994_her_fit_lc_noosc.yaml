# V994 Her - light-curve fit without the oscillation: minima (all, per-observer error floors), radial velocities (Lee et
# al. 2008) and the TESS light curves of sectors 26 (SPOC), 40 and 53 (QLP) cut to +-0.2 d around the eclipses, from which the
# oscillation of period P_A - P_B = 0.663 d (Zasche et al. 2023, Sect. 3: they removed it before their fit as well) and three
# weaker residual periods were removed (tools/remove_oscillation.py; out of eclipse 7.0 -> 2.1 ppt in sector 40). Every sector
# has its own depth scale (sector 26 SPOC: eclipses 1.7x deeper than in QLP - the SPOC crowding correction), red-noise
# errors. Published priors on the A-B orbit as in fit_lc. Started at fit_rv. ~5-8 h on 12 cores.
# Run: job sq3_15; results in output/squadra_test/v994_her/fit_lc_noosc/. t = 0 = BJD 2459010.0.
topology: 2+2+2
masses: {m1: 2.422145112481009, m2: 1.8524972607201338, m3: 1.9543891744633792, m4: 2.0107782348841408, m5: 1.81, m6: 1.077}
orbits:
  A: {P: 2.083306961639836, e: 0.024684728134383643, i: 84.66, Omega: 0.0, omega: 193.9560304688207, M0: 226.5893151760343}
  B: {P: 1.420087937172817, e: 0.11884178308831685, i: 89.19, Omega: 0.0, omega: 177.56443850114604, M0: 258.6230923649687}
  AB: {P: 1060.5380143144134, e: 0.590911747121354, i: 83.0, Omega: 0.0, omega: 56.23851275571667, M0: 290.2009918013911}
  C: {P: 1.9600977497872452, e: 0.2104544983644061, i: 80.42, Omega: 0.0, omega: 303.196814902708, M0: 131.8742753739364}
  out: {P: 1095750.0, e: 0.3, i: 83.0, Omega: 0.0, omega: 0.0, M0: 0.0}
stars:
  m1: {R: 2.118, Teff: 11890}
  m2: {R: 1.721, Teff: 9915}
  m3: {R: 1.572, Teff: 8832}
  m4: {R: 1.579, Teff: 8895}
  m5: {R: 1.544, Teff: 8514}
  m6: {R: 0.961, Teff: 5893}
stellar_model: {kind: mist, age_myr: 83.0, feh: 0.073, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 30, n_output: 3001, extremes_every_orbits: 20}
fit:
  minima: ../../data/observed/v994_her/minima_zasche2023.csv
  time_system: BJD_TDB
  lc:
  - {file: ../../data/observed/v994_her/lc_tess_s26_s40_s53_noosc_windows.csv, label: TESS, exposure_min: 10.0, n_sub: 1, baseline_degree: 1, scale: true, red_noise: true}
  rv: {file: ../../data/observed/v994_her/rv_lee2008.csv, gamma: -33.78}
  stage2:
    bjd_t0: 2459010.0
    anchor: false
    max_sigma_d: 0.01
    error_scale: per_source
    error_model: jitter
    clip_sigma: 5.0
    processes: 0
    free: [orbits.A.P, orbits.A.M0, orbits.A.ecosw, orbits.A.esinw, orbits.B.P, orbits.B.M0, orbits.B.e, orbits.B.omega, orbits.C.P, orbits.C.M0, orbits.C.e, orbits.C.omega, orbits.AB.P, orbits.AB.M0, orbits.AB.e,
      orbits.AB.omega, masses.m1, masses.m2, masses.m3, masses.m4, rv.gamma, orbits.A.i, orbits.B.i, orbits.C.i, stars.m1.R, stars.m2.R, stars.m3.R, stars.m4.R]
    priors:
      orbits.AB.P: [1062.3, 2.6]
      orbits.AB.e: [0.687, 0.044]
      orbits.AB.omega: [59.6, 3.8]
    max_iterations: 60
  output: {dir: ../../output/squadra_test/v994_her/fit_lc_noosc}
