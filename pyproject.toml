[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swingersim"
version = "1.0.0"
description = "SWINGERsim: simulator of hierarchical multiple stars (3 to 10 stars) - dynamics, stellar evolution, tides, mass transfer, eclipses and fits to observations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Milan Uhlár" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",  # solve_ivp events with an integer terminal count
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "h5py>=3.10",
    "rebound>=4.0",
    "reboundx>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
viz = ["plotly>=5.20", "kaleido>=1.0", "matplotlib>=3.8"]
ensemble = ["pandas>=2.0", "pyarrow>=14"]
fast = ["numba>=0.58"]
sbi = ["sbi>=0.23", "torch>=2.2"]
emulator = ["scikit-learn>=1.3"]
phoebe = ["phoebe>=2.5"]
fit = ["emcee>=3.1", "corner>=2.2", "astropy>=6.0"]
# everything except the heavy optional engines (PHOEBE, PyTorch for sbi)
all = ["swingersim[viz,ensemble,fast,emulator,fit]"]

[project.scripts]
swingersim = "swingersim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swingersim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: long integrations (deselect with -m 'not slow')",
    "validation: benchmarks against published results (about 1 minute)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]
