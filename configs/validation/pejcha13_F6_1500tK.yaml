# As pejcha13_F6.yaml, 1500 Kozai times, 200 members; records the first time 1 - e < 1e-3
# (columns *_t_1me_lt_1e-3_yr) to show how the fraction grows with time.
# Setup of Pejcha et al. (2013) MNRAS 435, 943, Table 1, entry F6 (see pejcha13_F6.yaml).
topology: "2+2"
masses: {m1: 1.0, m2: 1.0, m3: 1.0, m4: 1.0}
orbits:
  A:   {a: 0.573, e: 0.3}
  B:   {a: 0.351, e: 0.1}
  out: {a: 6.0, e: 0.3}          # reference plane = mutual orbit (i = 0)
physics: {gr: false}             # point masses, as in the paper
run: {t_max_yr: 97350, n_output: 500, collisions: false, backend: secular}
ensemble:
  n: 200
  seed: 13
  vary:
    orbits.A.i: isotropic
    orbits.B.i: isotropic
    orbits.A.Omega: angle
    orbits.B.Omega: angle
    orbits.A.omega: angle
    orbits.B.omega: angle
    orbits.out.omega: angle
    orbits.A.M0: angle
    orbits.B.M0: angle
    orbits.out.M0: angle
