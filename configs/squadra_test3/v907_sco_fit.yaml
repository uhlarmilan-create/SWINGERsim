# V907 Sco - path 2 "data -> model": joint N-body fit (swingersim fit, stage 2) of everything measured, starting from
# v907_sco_published.yaml (see there for the physics and the sources):
#   * 58 times of minima from TESS 2021-2025 (S39, S66, S91-93; tools/tess_minima.py) - primary and secondary drift apart
#     (e cos omega of the pair changes within years: the perturbation by the 142-d third star),
#   * 14 inclinations of the pair 1900-2022 (Zasche et al. 2023, Table 2: DASCH, APPLAUSE, TESS, FRAM)
#     fit.inclination: the N-body i(t) of the pair, integrated backward 120 yr from t = 0,
#   * 172 radial velocities: CHIRON 2022 (Zasche et al. 2023, Table A1) and Lacy, Helt & Vaz 1999 (1983-1994,
#     own zero point) - the two sets 30 yr apart fix the period of the outer orbit (Lacy: 99 d, Zasche: 142 d).
# Free: the inner pair (P, M0, e cos w, e sin w, i, Omega), the outer orbit (P, M0, e, omega, i, Omega), the mass of the
# third star, gamma and the Lacy offset. Masses of the pair fixed (Zasche: 2.56 + 2.74 +- 0.02).
# Expected results: P_nodal and J (paper: 63.5 yr, 26.2 deg), m3 (1.06), the eclipse windows of the 20th century and
# when the eclipses stop next (paper: ~2049).
# NOTE: this first pass (job sq4_5) starts from the angles of the paper as printed, omega_inner = 122.6 deg, i.e.
#   WITHOUT the 180-deg conversion to the SWINGERsim convention (302.6 deg, see v907_sco_published.yaml); it is kept
#   unchanged because it documents that trap (anchored: secondary minima 40.8 min off, rms 30.3 min). The second
#   pass v907_sco_fit_v2.yaml starts at omega = 301.7 deg.
topology: custom
hierarchy: {out: [inner, m3], inner: [m1, m2]}
masses: {m1: 2.56, m2: 2.74, m3: 1.06}
orbits:
  inner: {P: 3.7747839, e: 0.008, i: 76.61, Omega: 17.27, omega: 122.6, M0: 43.95}
  out:   {P: 142.01,    e: 0.467, i: 68.80, Omega: -8.97, omega: 22.7,  M0: 40.7}
stars:
  m1: {R: 2.53, Teff: 10004}
  m2: {R: 2.68, Teff: 10000}
  m3: {R: 1.00, Teff: 5900}
stellar_model: {kind: mist, age_myr: 400.0, feh: 0.0, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 30, n_output: 3001, extremes_every_orbits: 20}

fit:
  minima: ../../data/observed/v907_sco/minima_tess.csv
  time_system: BJD_TDB
  inclination:
    - {file: ../../data/observed/v907_sco/inclination_zasche2023.csv, pair: inner, label: Zasche2023, min_sigma_deg: 0.1}
  rv:
    file: ../../data/observed/v907_sco/rv_all.csv
    gamma: -17.33
    offsets: {Lacy1999: 0.0}
  stage2:
    bjd_t0: 2459383.9
    anchor: true              # first anchor P and M0 of the pair to the TESS minima
    free: [orbits.inner.P, orbits.inner.M0, orbits.inner.ecosw, orbits.inner.esinw, orbits.inner.i, orbits.inner.Omega,
           orbits.out.P, orbits.out.M0, orbits.out.e, orbits.out.omega, orbits.out.i, orbits.out.Omega,
           masses.m3, rv.gamma, rv.offset.Lacy1999]
    error_scale: per_source   # own error floor of every TESS sector and RV source
    error_model: jitter
    clip_sigma: 5.0
    priors:
      orbits.out.e: [0.47, 0.05]     # Zasche et al. 2023 (0.467 +- 0.019) widened; our refit 0.485
    max_iterations: 40
    processes: 0
  output:
    dir: ../../output/squadra_test3/v907_sco/fit
    predict: {years: 30, samples: 100}
