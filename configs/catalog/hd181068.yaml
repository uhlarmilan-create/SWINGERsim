# HD 181068 = KIC 5952403: a red giant (A, 3 Msun, 12.5 Rsun) orbited every 45.5 d by a compact
# 0.906-d pair of G/K dwarfs; triply eclipsing, coplanar and circular. Hierarchy (A+(Ba+Bb)).
# Source: Borkovits T. et al. 2013, MNRAS 428, 1656 (doi:10.1093/mnras/sts146), Table 4:
#   Ba-Bb P = 0.9056768 d, a = 4.777 Rsun, e = 0, i = 86.7 (Wikipedia: 87.6, to be checked);
#   A-B P = 45.4711 d, a = 90.31 Rsun, e = 0, i = 87.5; node difference 0.0 +- 0.5 deg;
#   masses 3.0/0.915/0.870 Msun, radii 12.46/0.865/0.800 Rsun, Teff 5100/5100/4675 K.
#   Discovery: Derekas A. et al. 2011, Science 332, 216 (doi:10.1126/science.1201762).
# Why: a giant as the tertiary of a compact triple: tidally excited oscillations of the giant at
#   twice the inner orbital frequency, and a future in which the giant fills its Roche lobe
#   around the inner binary (hd181068_evolution.yaml).
# Validation: coplanar circular orbits stay coplanar (no nodal precession, i constant - the
#   paper rules out changes > 10 deg); light-time ETV of the inner pair, amplitude ~1.1e-3 d;
#   Roche-lobe filling of A ~0.3 (summary).
#   swingersim run configs/catalog/hd181068.yaml -o output/catalog/hd181068.h5
topology: custom
hierarchy: {out: [m1, B], B: [m2, m3]}
masses: {m1: 3.0, m2: 0.915, m3: 0.870}
orbits:
  B:   {P: 0.9056768, e: 0.0, i: 86.7}
  out: {P: 45.4711, e: 0.0, i: 87.5}
stars:
  m1: {R: 12.46, Teff: 5100}
  m2: {R: 0.865, Teff: 5100}
  m3: {R: 0.800, Teff: 4675}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 20, n_output: 4001}
