# CzeV4315, plain 2+2 tested on equal terms with the 2+(2+1) hierarchy
# (configs/squadra/czev4315_2p2p1_tides_ensemble.yaml). In a 2+2 the 119-d periodicity in the
# ETV of pair B (Zasche et al. 2025, arXiv:2504.17298) must be the mutual orbit of A and B, so
# its period is drawn from the same N(119, 3) d. Same backend (N-body: at P_out ~ 119 d the
# configuration is near the stability limit, MA01 ~ 1.4, where the secular approximation does not
# hold), same physics (GR, tides, rotation), same time span (+-100 yr) and the same observations
# (rate of B, A eclipsing for years, detached pairs, survival in both directions).
# Special test after the campaign: evidence of 2+2 vs 2+(2+1) (ensemble-report).
# ESTIMATES (not from the paper): masses and radii as in czev4315_ensemble.yaml.
topology: "2+2"
masses: {m1: 2.4, m2: 2.09, m3: 2.3, m4: 2.35}
orbits:
  A:   {P: 6.73907,   e: 0.64, i: 87.44, Omega: 0.0}
  B:   {P: 0.9193238, e: 0.0,  i: 63.4}
  out: {P: 119.0,     e: 0.3,  i: 90.0}
stars:
  m1: {R: 1.73}
  m2: {R: 1.63}
  m3: {R: 1.83}
  m4: {R: 1.81}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 100, n_output: 2001, extremes_every_orbits: 20, max_wall_s: 3600}
ensemble:
  n: 1000
  seed: 4317
  directions: [forward, backward]
  require: [stable_v22]
  vary:
    orbits.A.i: {normal: [87.44, 0.21], max: 90.0}
    orbits.A.omega: angle
    orbits.B.i: {normal: [63.4, 0.4], mirror: true}
    orbits.B.Omega: angle
    orbits.out.P: {normal: [119.0, 3.0]}
    orbits.out.e: {uniform: [0.0, 0.7]}
    orbits.out.i: isotropic
    orbits.out.Omega: angle
    orbits.out.omega: angle
  observed:
    B_dtiltdt0_deg_yr: {value: -1.4, sigma: 0.2}
    backward:A_eclipse_change_yr: {max: -5.0, missing_ok: true}
    forward:A_eclipse_change_yr: {min: 0.25, missing_ok: true}
    backward:m1_roche_fill_max: {max: 1.0}
    backward:m2_roche_fill_max: {max: 1.0}
    backward:m3_roche_fill_max: {max: 1.0}
    backward:m4_roche_fill_max: {max: 1.0}
    backward:fate: {equals: intact}
    forward:fate: {equals: intact}
