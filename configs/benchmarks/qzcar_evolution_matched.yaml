# QZ Car = HD 93206: fate of the system with the present radii of Brož et al. (2022) reproduced
# by the MIST tracks (non-rotating; the rotating v/vcrit = 0.4 tracks cannot give Aa1 its
# radius of 28.3 Rsun at 69.8 Msun).
# The components are not coeval for single-star tracks: at their dynamical masses the radii of
# Table 3 are reached at 6.01 Myr (Ac1), 3.54 Myr (Ac2) and 2.535 Myr (Aa1); in the HR diagram
# Ac1 and Ac2 look 5.1-5.6 Myr old and Aa1 3.9 Myr (swingersim validate qzcar-evolutionary-mass-*).
# Products of binary interaction (stripped donor Ac1, gainers Ac2 and Aa1) are described here by
# effective ages: stellar_model.age_myr = 2.535 Myr (Aa1) and stars.*.age_offset_myr, so every
# star starts with its observed radius and evolves along its track from there. Aa2 (radius from
# a main-sequence calibration in Brož et al.) keeps the system age.
# Secular backend, forward until the first Roche-lobe overflow or the end of the tracks; the
# unconstrained orientations are isotropic, masses and outer orbit within the Table 2 errors
# (m1 below 27.5 Msun: heavier stars do not exist at 6.01 Myr).
# Questions: which star overflows first and when (Brož et al.: Ac1 -> Ac2 transfer), how far the
# winds widen the orbits.
#   swingersim ensemble configs/benchmarks/qzcar_evolution_matched.yaml -o output/benchmarks/qzcar_evolution_matched
topology: "2+2"
masses: {m1: 25.5, m2: 33.2, m3: 69.8, m4: 8.85}
orbits:
  A:   {P: 5.998599,  e: 0.00133, i: 93.0, Omega: 326.5, omega: 16.9,  M0: 283.15}
  B:   {P: 20.734367, e: 0.41495, i: 93.0, Omega: 326.0, omega: 117.8, M0: 263.38}
  out: {P: 14728.0,   e: 0.53951, i: 92.1, Omega: 326.7, omega: 329.0, M0: 53.42}
stars:
  m1: {P_rot: 6.98, age_offset_myr: 3.475}
  m2: {P_rot: 1.48, age_offset_myr: 1.008}
  m3: {P_rot: 13.27}
  m4: {P_rot: 2.22}
stellar_model: {kind: mist, age_myr: 2.535, feh: 0.0, vvcrit: 0.0}
physics:
  gr: true
  tides: true
  rotation: true
  evolution: true
  mass_loss: {source: track, masses: current}
run: {backend: secular, t_max_yr: 5.0e6, n_output: 501, max_wall_s: 1800}
ensemble:
  n: 1000
  seed: 93207
  directions: [forward]
  require: [stable_v22]
  vary:
    masses.m1: {normal: [25.5, 2.0], min: 18.0, max: 27.5}
    masses.m2: {normal: [33.2, 2.0], min: 25.0, max: 41.0}
    masses.m3: {normal: [69.8, 5.0], min: 55.0, max: 80.0}
    masses.m4: {normal: [8.85, 2.0], min: 4.0, max: 14.0}
    orbits.A.Omega: angle
    orbits.B.i: isotropic
    orbits.B.Omega: angle
    orbits.B.omega: {normal: [117.8, 10.0]}
    orbits.out.P: {normal: [14728.0, 100.0]}
    orbits.out.e: {normal: [0.54, 0.12], min: 0.0, max: 0.9}
    orbits.out.i: {normal: [92.1, 1.0]}
    orbits.out.Omega: {normal: [326.7, 1.0]}
