# qx_cas_fit_v2.yaml started from the best known solution (output/squadra_test3/qx_cas/fit_v2 of the code before
# the code review, chi^2 1819.43 -> 82.4964 (reduced 0.8505; priors 1.283); errors of the minima scaled by sqrt(max(chi^2_red, 1)) = 1): the fit from the published start values ends in another local
# minimum (offset primary / secondary minima). Same data, free parameters and settings; anchor off.
topology: custom
hierarchy:
  out: [inner, m3]
  inner: [m1, m2]
masses: {m1: 5.5, m2: 6.5, m3: 5.138004935104907}
orbits:
  inner: {P: 6.001825165144269, e: 0.23012937249161966, i: 81.4950208669587, Omega: 351.46, omega: 52.2646243925,
    M0: 13.5530799899}
  out: {P: 287.66071617402844, e: 0.2, i: 69.2057008735984, Omega: 3.3772774295, omega: 0.0, M0: 0.0}
stars:
  m1: {R: 3.5, Teff: 24000}
  m2: {R: 5.1, Teff: 18000}
  m3: {R: 2.0, Teff: 12000}
stellar_model: {kind: mist, age_myr: 60.0, feh: 0.0, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 30, n_output: 3001, extremes_every_orbits: 20}
fit:
  minima: ../../data/observed/qx_cas/minima_varastro.csv
  time_system: BJD_TDB
  inclination:
  - {file: ../../data/observed/qx_cas/inclination_limits.csv, pair: inner, label: Bonaro2009+limits}
  stage2:
    bjd_t0: 2444500.0
    anchor: false
    free: [orbits.inner.P, orbits.inner.M0, orbits.inner.ecosw, orbits.inner.esinw, orbits.inner.i, orbits.out.P,
      orbits.out.i, orbits.out.Omega, masses.m3]
    error_scale: per_source
    error_model: jitter
    clip_sigma: 4.0
    priors:
      masses.m3: [3.0, 2.0]
      orbits.out.P: [400.0, 300.0]
    bounds:
      masses.m3: [0.3, 6.0]
    max_iterations: 40
    processes: 0
  output:
    dir: ../../output/squadra_test3/qx_cas/fit_v2_best
    predict: {years: 50, samples: 100}
