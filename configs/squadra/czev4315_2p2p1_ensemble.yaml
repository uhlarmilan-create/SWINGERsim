# CzeV4315, alternative hierarchy 2+(2+1): pair B has its own third star (m5) on the 119-d
# orbit seen in the ETV of B (Zasche et al. 2025, arXiv:2504.17298), and pair A orbits this
# triple on a wider, unknown orbit. Compare with czev4315_ensemble.yaml (plain 2+2), where the
# fast change of B forces an outer period of ~100 d at which A should precess even faster.
# ESTIMATES (not from the paper): masses and radii of A and B as in czev4315_ensemble.yaml,
# mass of the third star (drawn), the 0.2 deg/yr error of the rate of B.
# N-body backend (the secular backend handles 2+2 only); +-60 yr.
topology: "2+(2+1)"
masses: {m1: 2.4, m2: 2.09, m3: 2.3, m4: 2.35, m5: 1.0}
orbits:
  A:   {P: 6.73907,   e: 0.64, i: 87.44, Omega: 0.0}
  B:   {P: 0.9193238, e: 0.0,  i: 63.4}
  Bt:  {P: 119.0,     e: 0.2,  i: 60.0}
  out: {P: 10000.0,   e: 0.3,  i: 90.0}
stars:
  m1: {R: 1.73}
  m2: {R: 1.63}
  m3: {R: 1.83}
  m4: {R: 1.81}
physics: {gr: true}
run: {t_max_yr: 60, n_output: 1201, extremes_every_orbits: 20, max_wall_s: 900}
ensemble:
  n: 3000
  seed: 4316
  directions: [forward, backward]
  require: [stable_v22]
  vary:
    masses.m5: {loguniform: [0.3, 3.0]}
    orbits.A.i: {normal: [87.44, 0.21], max: 90.0}
    orbits.A.omega: angle
    orbits.B.i: {normal: [63.4, 0.4], mirror: true}
    orbits.B.Omega: angle
    orbits.Bt.P: {normal: [119.0, 3.0]}
    orbits.Bt.e: {uniform: [0.0, 0.6]}
    orbits.Bt.i: isotropic
    orbits.Bt.Omega: angle
    orbits.Bt.omega: angle
    orbits.out.P: {loguniform: [1500.0, 100000.0]}
    orbits.out.e: {uniform: [0.0, 0.7]}
    orbits.out.i: isotropic
    orbits.out.Omega: angle
    orbits.out.omega: angle
  observed:
    B_dtiltdt0_deg_yr: {value: -1.4, sigma: 0.2}
    # A has eclipsed for years (TESS and ground-based data) and still does
    backward:A_eclipse_change_yr: {max: -5.0, missing_ok: true}
    forward:A_eclipse_change_yr: {min: 0.25, missing_ok: true}
    backward:m1_roche_fill_max: {max: 1.0}
    backward:m2_roche_fill_max: {max: 1.0}
    backward:m3_roche_fill_max: {max: 1.0}
    backward:m4_roche_fill_max: {max: 1.0}
