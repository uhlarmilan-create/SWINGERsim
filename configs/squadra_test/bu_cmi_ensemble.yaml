# BU CMi: ensemble around the published solution (Pribulla et al. 2023, MNRAS 524, 4220,
# Table 7; see bu_cmi_published.yaml for the conversions). Every member draws the parameters
# within their published 1-sigma errors and is integrated 40 yr forward and 40 yr backward
# (N-body, GR, tides, rotation). Question: do the systems that are compatible with the published
# errors reproduce the observed apsidal periods (28.7 and 25.1 yr), stay flat and eclipsing, and
# survive in both directions of time?
# Observations used as conditions (observed:): apsidal periods of A and B (measured from the run,
#   0.5-yr tolerance), both pairs eclipsing now, intact forward and backward.
topology: "2+2"
masses: {m1: 2.536, m2: 2.384, m3: 2.521, m4: 2.320}
orbits:
  A:   {P: 2.937533, e: 0.2191, i: 83.35, Omega: 0.14, omega: 101.41, M0: 284.66}
  B:   {P: 3.255815, e: 0.2257, i: 83.92, Omega: 0.0,  omega: 257.52, M0: 255.39}
  out: {P: 121.793,  e: 0.2728, i: 83.79, Omega: 0.09, omega: 141.0,  M0: 294.71}
stars:
  m1: {R: 2.249, Teff: 10570}
  m2: {R: 2.072, Teff: 10283}
  m3: {R: 2.235, Teff: 10593}
  m4: {R: 2.003, Teff: 10062}
stellar_model: {kind: mist, age_myr: 263.0, feh: 0.02, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 40, n_output: 801, extremes_every_orbits: 20}
ensemble:
  n: 600
  seed: 2023
  directions: [forward, backward]
  vary:
    masses.m1: {normal: [2.536, 0.12]}
    masses.m2: {normal: [2.384, 0.11]}
    masses.m3: {normal: [2.521, 0.14]}
    masses.m4: {normal: [2.320, 0.11]}
    orbits.A.e: {normal: [0.2191, 0.0008]}
    orbits.B.e: {normal: [0.2257, 0.0009]}
    orbits.out.e: {normal: [0.2728, 0.0037]}
    orbits.A.i: {normal: [83.35, 0.13]}
    orbits.B.i: {normal: [83.92, 0.14]}
    orbits.out.i: {normal: [83.79, 0.26]}
    orbits.B.Omega: {normal: [0.0, 0.6]}
    orbits.out.Omega: {normal: [0.09, 0.17]}
    orbits.out.omega: {normal: [141.0, 3.6]}
    orbits.out.P: {normal: [121.793, 0.031]}
  observed:
    A_U_measured_yr: {value: 28.7, sigma: 0.5}
    B_U_measured_yr: {value: 25.1, sigma: 0.5}
    A_eclipsing0: {min: 0.5}
    B_eclipsing0: {min: 0.5}
    "backward:fate": {equals: intact}
    "forward:fate": {equals: intact}
