# TIC 120362137: the most compact known 3+1 quadruple - an eclipsing pair of F stars (3.28 d),
# a third F star on a 51.3-d orbit and a G star on a 1046-d orbit, all nearly coplanar; the
# primary is slightly evolved. Hierarchy (((Aa+Ab)+B)+C) = SWINGERsim preset 3+1.
# Source: Borkovits T. et al. 2026, Nat. Commun. 17, 1859 (doi:10.1038/s41467-026-69223-4),
#   Tables 1 and 2 (photodynamical solution): Aa-Ab P = 3.284187 d, e = 0.00735, omega = 199.4,
#   i = 88.70, Omega = 0, tau = BJD 2458683.790; A-B P = 51.3111 d, e = 0.22367, omega = 190.05,
#   i = 89.05, Omega = 0.26, tau = 2458661.077; AB-C P = 1045.5 d, e = 0.274, omega = 289.0,
#   i = 90.3, Omega = 0.10, tau = 2459147; masses 1.748/1.361/1.483/1.008 Msun, radii
#   2.996/1.507/1.768/0.927 Rsun, Teff 6612/6724/6937/5772 K, log age 9.189, [M/H] = +0.036.
# Conversions: t = 0 at BJD 2458683.790: M0 = 0, 159.36, 200.50 deg. The omega convention of
#   the photodynamical code (relative orbit vs. primary) is to be checked in the paper.
# Why: a compact, almost flat 3+1 with strong dynamical interaction; the precession periods
#   are published and are a direct test of the N-body and the secular backends.
# Validation: published precession periods 34.79 yr and 896 yr (apsidal) and 265.8 yr (nodal)
#   - which orbit each belongs to must be checked in the paper; mutual inclinations 0.47 deg
#   (inner triple) and 5.7 deg (outer).
#   swingersim run configs/catalog/tic120362137.yaml -o output/catalog/tic120362137.h5
topology: "3+1"
masses: {m1: 1.748, m2: 1.361, m3: 1.483, m4: 1.008}
orbits:
  inner: {P: 3.284187, e: 0.00735, i: 88.70, Omega: 0.0, omega: 199.4, M0: 0.0}
  mid:   {P: 51.3111, e: 0.22367, i: 89.05, Omega: 0.26, omega: 190.05, M0: 159.36}
  out:   {P: 1045.5, e: 0.274, i: 90.3, Omega: 0.10, omega: 289.0, M0: 200.50}
stars:
  m1: {R: 2.996, Teff: 6612}
  m2: {R: 1.507, Teff: 6724}
  m3: {R: 1.768, Teff: 6937}
  m4: {R: 0.927, Teff: 5772}
stellar_model: {kind: mist, age_myr: 1545.0, feh: 0.036, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 1000, n_output: 5001, extremes_every_orbits: 20}
