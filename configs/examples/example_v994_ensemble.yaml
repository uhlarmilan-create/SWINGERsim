# Monte Carlo ensemble of a V994 Her-like 2+2 (Vokrouhlicky 2016 Fig. 7 setup + GR).
# Photometry fixes the inclinations of the eclipsing binaries to the sky, but not the position
# angles of their nodes on the sky nor the orientation of the outer orbit; these are drawn here,
# so that the mutual inclinations are unknown. The uncertainties of the masses and inclinations
# are ILLUSTRATIVE (2 % and 1 deg), not taken from a paper - replace them with your own.
#   swingersim ensemble configs/examples/example_v994_ensemble.yaml -o output/v994_ensemble -j 4
topology: "2+2"
masses: {m1: 3.01, m2: 2.58, m3: 1.84, m4: 1.93}
orbits:
  A:   {P: 2.08327,   e: 0.031, i: 84.0, Omega: 0.0, omega: 10.0}
  B:   {P: 1.42004,   e: 0.125, i: 85.0, Omega: 0.0, omega: 301.0}
  out: {P: 1062.8775, e: 0.76,  i: 90.0, Omega: 0.0, omega: 236.0}
stars:
  m1: {R: 2.4, apsidal_k2: 0.007542}
  m2: {R: 2.1, apsidal_k2: 0.007542}
  m3: {R: 1.6, apsidal_k2: 0.003334}
  m4: {R: 1.7, apsidal_k2: 0.003334}
physics: {gr: true, tides: true}
run: {t_max_yr: 10000, n_output: 1000, backend: secular}
ensemble:
  n: 200
  seed: 994
  directions: [forward, backward]     # the next and the past 10 kyr
  require: [stable_v22]
  vary:
    masses.m1: {normal: [3.01, 0.06]}
    masses.m2: {normal: [2.58, 0.05]}
    masses.m3: {normal: [1.84, 0.04]}
    masses.m4: {normal: [1.93, 0.04]}
    orbits.A.i: {normal: [84.0, 1.0], max: 90.0}   # i of A defines 'prograde'
    orbits.B.i: {normal: [85.0, 1.0], max: 90.0, mirror: true}  # 85 or 95 deg
    orbits.B.Omega: angle             # node of B on the sky relative to the node of A
    orbits.out.i: isotropic           # outer orbit orientation unknown
    orbits.out.Omega: angle
