# As pejcha13_F6.yaml, three times longer (900 Kozai times), 200 members: shows that the
# fraction still grows with time (SWINGERsim: 0.325 for A, 0.505 for B).
topology: "2+2"
masses: {m1: 1.0, m2: 1.0, m3: 1.0, m4: 1.0}
orbits:
  A:   {a: 0.573, e: 0.3}
  B:   {a: 0.351, e: 0.1}
  out: {a: 6.0, e: 0.3}          # reference plane = mutual orbit (i = 0)
physics: {gr: false}             # point masses, as in the paper
run: {t_max_yr: 58410, n_output: 500, collisions: false, backend: secular}
ensemble:
  n: 200
  seed: 13
  vary:
    orbits.A.i: isotropic
    orbits.B.i: isotropic
    orbits.A.Omega: angle
    orbits.B.Omega: angle
    orbits.A.omega: angle
    orbits.B.omega: angle
    orbits.out.omega: angle
    orbits.A.M0: angle
    orbits.B.M0: angle
    orbits.out.M0: angle
