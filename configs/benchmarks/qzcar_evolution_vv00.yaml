# QZ Car = HD 93206: fate of the system over the rest of its life (non-rotating MIST models).
# Nominal system of Brož et al. (2022), A&A 666, A24, Table 2 (see qzcar_nominal.yaml), with
# stellar evolution and wind mass loss from the MIST tracks: the Table 2 masses
# are present masses at an age of 2.5 Myr (physics.mass_loss.masses: current; Aa1 = 69.8 Msun
# exists only up to ~2.7 Myr). Secular backend, forward until the end of the tracks or the first
# Roche-lobe overflow. The unconstrained orientations (Omega of Ac, i and Omega of Aa) are drawn
# isotropically, masses and the outer orbit within the Table 2 uncertainties.
# Questions: which star overflows its Roche lobe first and when; how far do the winds widen the
# outer orbit; does the inclination of the orbits matter (ZLK is quenched by tides and GR).
#   swingersim ensemble configs/benchmarks/qzcar_evolution_vv00.yaml -o output/benchmarks/qzcar_evolution_vv00
topology: "2+2"
masses: {m1: 25.5, m2: 33.2, m3: 69.8, m4: 8.85}
orbits:
  A:   {P: 5.998599,  e: 0.00133, i: 93.0, Omega: 326.5, omega: 16.9,  M0: 283.15}
  B:   {P: 20.734367, e: 0.41495, i: 93.0, Omega: 326.0, omega: 117.8, M0: 263.38}
  out: {P: 14728.0,   e: 0.53951, i: 92.1, Omega: 326.7, omega: 329.0, M0: 53.42}
stars:
  m1: {P_rot: 6.98}
  m2: {P_rot: 1.48}
  m3: {P_rot: 13.27}
  m4: {P_rot: 2.22}
stellar_model: {kind: mist, age_myr: 2.5, feh: 0.0, vvcrit: 0.0}
physics:
  gr: true
  tides: true
  rotation: true
  evolution: true
  mass_loss: {source: track, masses: current}
run: {backend: secular, t_max_yr: 5.0e6, n_output: 501, max_wall_s: 1800}
ensemble:
  n: 1000
  seed: 93206
  directions: [forward]
  require: [stable_v22]
  vary:
    masses.m1: {normal: [25.5, 2.0], min: 18.0, max: 33.0}
    masses.m2: {normal: [33.2, 2.0], min: 25.0, max: 41.0}
    masses.m3: {normal: [69.8, 5.0], min: 55.0, max: 74.0}
    masses.m4: {normal: [8.85, 2.0], min: 4.0, max: 14.0}
    orbits.A.Omega: angle
    orbits.B.i: isotropic
    orbits.B.Omega: angle
    orbits.B.omega: {normal: [117.8, 10.0]}
    orbits.out.P: {normal: [14728.0, 100.0]}
    orbits.out.e: {normal: [0.54, 0.12], min: 0.0, max: 0.9}
    orbits.out.i: {normal: [92.1, 1.0]}
    orbits.out.Omega: {normal: [326.7, 1.0]}
