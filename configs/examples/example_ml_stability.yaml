# Small training set for the stability classifier of the manual (docs: Machine learning):
# a reduced version of configs/validation/vynatheya23_2p2_ghost.yaml (Vynatheya, Mardling &
# Hamers 2023, MNRAS 525, 2388, Sect. 3.1) with 3000 members and the N-body ghost test over 30
# outer orbits (at most 60 s each) instead of 10 000 members and 100 orbits. Masses log-uniform
# over one order of magnitude, inner semi-major axes uniform as ratios of the (fixed) outer one,
# eccentricities uniform 0-0.95, isotropic angles, inner apocentres inside the outer pericentre,
# 70 % of the MA01-unstable draws dropped. The main run is a 1-yr placeholder.
#   swingersim ensemble configs/examples/example_ml_stability.yaml -o output/ml_stability -j 0
topology: 2+2
masses: {m1: 1.0, m2: 1.0, m3: 1.0, m4: 1.0}
orbits:
  A:   {a: 10.0}
  B:   {a: 10.0}
  out: {a: 100.0}
stellar_model: {kind: zams}
physics: {gr: false}
run: {backend: nbody, t_max_yr: 1.0, n_output: 2, collisions: false}
ensemble:
  n: 3000
  seed: 2023
  require: [hierarchical]
  ma01_unstable_keep: 0.3
  ghost_test: true
  ghost_orbits: 30
  ghost_max_wall_s: 60
  vary:
    masses.m1: {loguniform: [1.0, 10.0]}
    masses.m2: {loguniform: [1.0, 10.0]}
    masses.m3: {loguniform: [1.0, 10.0]}
    masses.m4: {loguniform: [1.0, 10.0]}
    orbits.A.a: {uniform: [1.0, 60.0]}
    orbits.B.a: {uniform: [1.0, 60.0]}
    orbits.A.e: {uniform: [0.0, 0.95]}
    orbits.B.e: {uniform: [0.0, 0.95]}
    orbits.out.e: {uniform: [0.0, 0.95]}
    orbits.A.i: isotropic
    orbits.B.i: isotropic
    orbits.out.i: isotropic
    orbits.A.Omega: angle
    orbits.B.Omega: angle
    orbits.out.Omega: angle
    orbits.A.omega: angle
    orbits.B.omega: angle
    orbits.out.omega: angle
    orbits.A.M0: angle
    orbits.B.M0: angle
    orbits.out.M0: angle
