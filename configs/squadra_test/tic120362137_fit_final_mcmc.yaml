# TIC 120362137 - final joint fit with realistic errors: 147 minima, 379 radial velocities (Borkovits et al. 2026,
# Source Data and Supplementary Data 7-9) and the nine TESS windows of the third-body eclipses (Supplementary Data 1), with
# the published priors, started at the light-curve fit (fit_lc, spherical stars: Roche surfaces changed the residuals by
# < 0.1 ppt). New against fit_lc: red-noise errors of the light curves and emcee (72 walkers x 400 steps) instead of the
# linear errors (fit_lc gave mass errors of 0.03 %, not realistic); predictions of the minima for 5 years with 100 samples.
# The depth scale a of every window stays free: Borkovits et al. give 51 % contaminating light in the TESS band
# (Table 2, extra light l_x = 0.510 +- 0.007), i.e. a = 0.49 expected. ~6-7 h on 12 cores.
# Run: job sq2_15; results in output/squadra_test/tic120362137/fit_final_mcmc/. t = 0 = BJD 2458683.3.
topology: 3+1
masses: {m1: 1.759508107290437, m2: 1.36490136262257, m3: 1.5189524080403514, m4: 0.9905974563997545}
orbits:
  inner: {P: 3.28619621007638, e: 0.007518655749221267, i: 88.81611790640304, Omega: 0.0, omega: 199.13882345023808, M0: 306.6334990270807}
  mid: {P: 51.30369108074154, e: 0.2229244268765737, i: 88.89142552537376, Omega: 0.0407811435502311, omega: 190.30278588095211, M0: 155.57592355010672}
  out: {P: 1034.4668789104094, e: 0.27259596522324947, i: 90.3, Omega: 0.1, omega: 284.4294028615968, M0: 199.22958787696064}
stars:
  m1: {R: 2.9971942311270605, Teff: 6612}
  m2: {R: 1.5667092493798347, Teff: 6724}
  m3: {R: 1.9181395914117199, Teff: 6937}
  m4: {R: 0.927, Teff: 5772}
stellar_model: {kind: mist, age_myr: 1545.0, feh: 0.036, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 100, n_output: 5001, extremes_every_orbits: 20}
fit:
  minima: ../../data/observed/tic120362137/minima_borkovits2026.csv
  time_system: BJD_TDB
  lc:
  - {file: ../../data/observed/tic120362137/lc_tess_tertiary_borkovits2026.csv, label: TESS, exposure_min: 30.0, n_sub: 3, baseline_degree: 1, scale: true, shapes: spheres, red_noise: true}
  rv:
    file: ../../data/observed/tic120362137/rv_borkovits2026.csv
    gamma: -22.124
    offsets: {SPO: 0.269, Konkoly-Rozhen: 0.028}
  stage2:
    bjd_t0: 2458683.3
    anchor: false
    max_sigma_d: 0.01
    error_scale: per_source
    error_model: jitter
    clip_sigma: 5.0
    processes: 0
    free: [orbits.inner.P, orbits.inner.M0, orbits.inner.ecosw, orbits.inner.esinw, orbits.mid.P, orbits.mid.M0, orbits.mid.e, orbits.mid.omega, orbits.out.P, orbits.out.M0, orbits.out.e, orbits.out.omega,
      masses.m1, masses.m2, masses.m3, masses.m4, rv.gamma, rv.offset.SPO, rv.offset.Konkoly-Rozhen, orbits.inner.i, orbits.mid.i, orbits.mid.Omega, stars.m1.R, stars.m2.R, stars.m3.R]
    priors:
      orbits.mid.e: [0.22367, 0.0007]
      orbits.mid.omega: [190.05, 0.32]
      orbits.out.P: [1045.5, 7.9]
      orbits.out.e: [0.274, 0.013]
      orbits.out.omega: [289.0, 4.8]
      orbits.out.M0: [200.33, 3.8]
    max_iterations: 30
    sampler: emcee
    walkers: 72   # as in the documented run on 12 cores (older versions rounded 52 up to a multiple of 2 x cores)
    mcmc_steps: 400
  output:
    dir: ../../output/squadra_test/tic120362137/fit_final_mcmc
    predict: {years: 5, samples: 100}
