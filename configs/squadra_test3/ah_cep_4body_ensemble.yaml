# AH Cep - could a closer FOURTH body hide in the minima and tilt the 1.78-d pair? (control job for part III)
# The fitted system (ah_cep fit: pair + third body on the 69-yr orbit) plus a fourth star m4 on an orbit "mid" around the
# pair, inside the 69-yr orbit: hierarchy ((m1+m2)+m4)+m3. Drawn: m4 0.3-8 Msun (log-uniform), P_mid 100-5000 d
# (log-uniform), e_mid 0-0.6, an isotropic orientation; only members stable by Mardling & Aarseth (2001).
# Each member is integrated 20 yr forward and backward: the present rate of change of the pair's inclination
# (inner_didt0_deg_yr) is compared afterwards (tools/squadra3_figures.py) with the largest light-time amplitude that the
# timing residuals allow (a few minutes: TESS 2019-2024 rms 5 min, no periodic signal in the residuals), i.e. which
# fourth bodies are both invisible in the O - C and able to change the inclination (Drechsel et al. 1989).
topology: custom
hierarchy: {out: [mid, m3], mid: [inner, m4], inner: [m1, m2]}
masses: {m1: 15.816, m2: 13.550, m3: 7.02, m4: 2.0}
orbits:
  inner: {P: 1.7765062, e: 0.0, i: 69.805, Omega: 0.0, omega: 90.0, M0: 15.94}
  mid:   {P: 800.0,  e: 0.2,  i: 60.0, Omega: 20.0, omega: 0.0, M0: 0.0}
  out:   {P: 25357.1, e: 0.631, i: 71.47, Omega: 10.0, omega: 255.8, M0: 195.97}
stars:
  m1: {R: 6.51, Teff: 30700}
  m2: {R: 5.64, Teff: 28800}
  m3: {R: 3.5, Teff: 20000}
  m4: {R: 1.5, Teff: 9000}
stellar_model: {kind: mist, age_myr: 6.0, feh: 0.0, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 20, n_output: 2001, extremes_every_orbits: 20}
ensemble:
  n: 1500
  seed: 4004
  directions: [forward, backward]
  vary:
    masses.m4: {loguniform: [0.3, 8.0]}
    orbits.mid.P: {loguniform: [100.0, 5000.0]}
    orbits.mid.e: {uniform: [0.0, 0.6]}
    orbits.mid.i: isotropic
    orbits.mid.Omega: angle
    orbits.mid.omega: angle
    orbits.mid.M0: angle
  require: [stable_ma01]
