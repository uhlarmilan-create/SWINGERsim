# Campaign "open questions", study S1b: V907 Sco - Cassini states of the spin of m1 (ensemble).
# As s1a, but the rotation period and the initial spin direction of m1 are drawn: P_rot 0.5-30 d (loguniform; the spin
# precession rate scales with the spin rate, so eta runs from ~0.1 to ~6), obliquity 0-90 deg (isotropic) at a random
# azimuth around the orbit normal. m2 stays synchronous. 600 yr (~10 nodal periods) per member, every run stored.
# Expected regimes (Anderson, Lai & Storch 2017): adiabatic (fast spin): the spin follows the orbit, obliquity stays
# near its initial value; non-adiabatic (slow spin): the spin stays nearly fixed in space, obliquity up to ~2 I;
# trans-adiabatic (near the resonance alpha ~ g): large and irregular obliquity excursions.
topology: custom
hierarchy: {out: [inner, m3], inner: [m1, m2]}
masses: {m1: 2.56, m2: 2.74, m3: 1.06}
orbits:
  inner: {P: 3.7747839, e: 0.008, i: 76.61, Omega: 17.27, omega: 122.6, M0: 43.95}
  out:   {P: 142.01,    e: 0.467, i: 68.80, Omega: -8.97, omega: 22.7,  M0: 40.7}
stars:
  m1: {R: 2.53, Teff: 10004}
  m2: {R: 2.68, Teff: 10000}
  m3: {R: 1.00, Teff: 5900}
stellar_model: {kind: mist, age_myr: 400.0, feh: 0.0, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}

run: {t_max_yr: 600, n_output: 1201, extremes_every_orbits: 50}
ensemble:
  n: 600
  seed: 1
  vary:
    stars.m1.P_rot: {loguniform: [0.5, 30.0]}
    stars.m1.obliquity: {isotropic: [0.0, 90.0]}
    stars.m1.spin_azimuth: {uniform: [0.0, 360.0]}
  save_runs: true
