# V907 Sco - 2+1 triple whose eclipses switch on and off (SQUADRA test, part III).
# Path 1 "physics -> model -> light": the published solution of
#   Zasche P., Vokrouhlicky D., Barlow B. N., Masek M. (2023), AJ 165, 81, doi:10.3847/1538-3881/acae95
#   (Table 1 inner pair, Table 3 outer orbit, Sec. 3.4: J = 26.2 deg, P_nodal = 63.5 yr, invariable plane at i = 71 deg).
# Inner pair (Aa+Ab, late-B MS): P1 = 3.7762049 d, e1 = 0.008, omega1 = 122.6, a1 = 17.8 Rsun,
#   m = 2.56 + 2.74 Msun, R = 2.53 + 2.68 Rsun, Teff 10004 / 10000 K (TIC 261030551, HD 163302).
# Third star (solar type): P2 = 142.01 d, e2 = 0.467 (0.485 from our refit of the CHIRON velocities), m3 = 1.06 Msun.
# Angles at t = 0 = BJD 2459383.9 (the reference epoch T0 of the paper's dynamical model, TESS S39b): the paper gives i1 = 76.61 deg (rising), J and the invariable plane;
#   the nodes below put l1 and l2 on opposite sides of the total angular momentum (invariable plane at i = 70.8 deg)
#   with amplitudes 18.2 and 8.0 deg (sum = J = 26.2 deg; sin 8.0 / sin 18.2 = L_in/L_out = 0.448, the ratio the paper
#   calls gamma), the solution whose i1(t) reproduces Table 2 (eclipses off ~1923-1956 and ~1986-2019).
# Outer orbit: T_peri = BJD 2459651.86 from the CHIRON velocities of the binary's centre of mass (omega of the
#   binary 202.7 deg -> omega of the third star's relative orbit 22.7 deg, the SWINGERsim convention); M0 = 40.7 deg.
# Inner omega: 302.6 deg = omega1 of the paper + 180 deg. SWINGERsim gives omega of the relative orbit of m2 around m1
#   and calls the eclipse of m1 primary; the paper's 122.6 deg belongs to the opposite convention (a 180-deg
#   difference). The TESS minima decide it: anchored, omega = 122.6 leaves the secondary minima 40.8 min off (rms
#   30.3 min), omega = 302.6 gives primaries +2.6 min, secondaries -1.9 min (rms 4.0 min).
# Inner P and M0: anchored to the 58 TESS minima 2021-2025 (swingersim fit v907_sco_fit.yaml --anchor with this
#   omega). P = 3.7748707 d is the osculating Keplerian period at t = 0 (from a(t0), mu = G(m1+m2)); the model's
#   eclipse period over 2021-2023 (5 outer orbits) is 3.7762183 d, longer by 1.348e-3 d = 1.94 min:
#   +1.33 min osculating -> mean semi-major axis (short-period terms from m3; a(t0) is 1.63e-4 below its mean),
#   +0.64 min secular perturbation of the mean motion by m3 (+1.05 min) together with the apsidal motion (-0.41 min),
#   -0.025 min the motion of the node projected on the sky. The paper's mean P1 = 3.7762049 +- 0.0000122 d.
#   The systemic velocity is not modelled: gamma/c = -17.33/299792 = -5.78e-5 would shorten the observed period
#   by 2.2e-4 d (0.31 min).
# Use: swingersim run v907_sco_published.yaml (200 yr: the inclination i(t) of the pair, eclipse windows),
#      swingersim run ... --t-max-yr -130 (back to 1890: the DASCH/Harvard plates),
#      swingersim timings ... --from-years -125 --years 30 --bjd-t0 2459383.9 (eclipse times / O-C),
#      swingersim lightcurve ... --days 30 --start-day 700 --cadence-min 10 (a TESS-like sector in 2023).
topology: custom
hierarchy: {out: [inner, m3], inner: [m1, m2]}
masses: {m1: 2.56, m2: 2.74, m3: 1.06}
orbits:
  inner: {P: 3.77487065, e: 0.008, i: 76.61, Omega: 17.27, omega: 302.6, M0: 223.7284}
  out:   {P: 142.01,    e: 0.467, i: 68.80, Omega: -8.97, omega: 22.7,  M0: 40.7}
stars:
  m1: {R: 2.53, Teff: 10004}
  m2: {R: 2.68, Teff: 10000}
  m3: {R: 1.00, Teff: 5900}
stellar_model: {kind: mist, age_myr: 400.0, feh: 0.0, vvcrit: 0.0}
physics: {gr: true, tides: true, rotation: true}
run: {t_max_yr: 200, n_output: 4001, extremes_every_orbits: 20}
