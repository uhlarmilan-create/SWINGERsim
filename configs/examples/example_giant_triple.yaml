# Example: an old giant with a main-sequence binary (illustrative values). A 2.0 Msun tertiary
# leaves the main sequence and climbs the giant branch and the AGB while the inner pair
# (1.3 + 1.1 Msun, P = 5 d) is still on the main sequence: coeval stars of 1.2 Gyr, MIST tracks
# to the end of the AGB, wind mass loss in the dynamics, tides from the
# convective envelopes (Hurley et al. 2002). The giant loses ~1.3 Msun on the AGB; the outer
# orbit widens (a M = const). On a thermal pulse of the TP-AGB the giant fills its Roche lobe
# at periastron (t = 141.8 Myr, R ~ 456 Rsun, ~1.09 Msun, a_out ~9.6 AU).
# The tertiary then transfers mass onto the inner pair (mass_transfer.tertiary); see
# configs/examples/example_tertiary_transfer.yaml.
#   swingersim run configs/examples/example_giant_triple.yaml -o output/giant_triple.h5
topology: custom
hierarchy: {out: [A, m3], A: [m1, m2]}
masses: {m1: 1.3, m2: 1.1, m3: 2.0}
orbits:
  A:   {P: 5.0, e: 0.05, i: 88.0}
  out: {P: 3650.0, e: 0.3, i: 60.0, Omega: 20.0}
stellar_model: {kind: mist, age_myr: 1200.0, feh: 0.0, vvcrit: 0.0}
physics:
  gr: true
  tides: true
  tidal_lag: hurley2002
  evolution: true
  mass_loss: {source: track}
run: {backend: secular, t_max_yr: 2.0e8, n_output: 1001}
