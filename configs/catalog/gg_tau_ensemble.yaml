# GG Tau: a very young (1-2 Myr) quintuple of T Tauri stars in Taurus, embedded in a massive
# circumbinary ring: Aa + (Ab1+Ab2) form GG Tau A inside the ring, Ba+Bb (an M5 + M7 pair near
# the brown-dwarf limit) lie 10 arcsec (~1400 AU) away. Hierarchy (Ba+Bb) + ((Ab1+Ab2)+Aa) =
# SWINGERsim preset 2+(2+1): A = Ba+Bb, B = Ab1+Ab2, m5 = Aa.
# Sources: Koehler R. 2011, A&A 530, A126 (doi:10.1051/0004-6361/201016327), Table 3, and
#   Keppler M. et al. 2020, A&A 639, A62 (doi:10.1051/0004-6361/202038032): Aa-Ab orbit coplanar
#   with the ring, a ~ 35 AU, e = 0.28, i = 143 deg (= the ring plane, i = 37, with retrograde
#   rotation on the sky), omega = 91, Omega = 277; Toci C. et al. 2024, A&A 688, A102: the orbit
#   is degenerate, a = 34-60 AU, e = 0.1-0.44. Di Folco E. et al. 2014, A&A 565, L2: Ab1-Ab2
#   separation 31.7 mas (~4.5 AU), P ~ 14-16 yr. Masses: Aa 0.65, Ab1 0.30, Ab2 0.20 (Keppler
#   2020), Ba 0.12, Bb 0.04 Msun (White et al. 1999).
# UNKNOWN and drawn: a (34-60 AU) and e (0.1-0.44) of Aa-Ab; the Ab1-Ab2 orbit (P 12-18 yr,
#   e 0-0.5, isotropic); Ba-Bb (separation 1.48 arcsec ~ 210 AU: a 150-300 AU); the outer
#   orbit (a 1000-3000 AU). Radii: Aa 1.63 Rsun (compilation); ASSUMED pre-main-sequence
#   radii 1.2/1.0 (Ab1/Ab2), 0.6/0.4 (Ba/Bb; Bb at 0.04 Msun is below the MIST grid).
# Why: is the close pair Ab1+Ab2 (periastron of Aa down to ~20 AU vs. its own ~4.5 AU) stable
#   inside GG Tau A? A young, gas-rich, low-mass quintuple - the opposite corner of the HR
#   diagram from the O-star systems.
# Validation: fraction of stable configurations (N-body over 2e4 yr ~ 120 orbits of Aa-Ab);
#   Koehler and Keppler require a long-lived configuration.
#   swingersim ensemble configs/catalog/gg_tau_ensemble.yaml -o output/catalog/gg_tau_ens -j 0
topology: "2+(2+1)"
masses: {m1: 0.12, m2: 0.04, m3: 0.30, m4: 0.20, m5: 0.65}
orbits:
  A:   {a: 210.0, e: 0.3, i: 60.0}
  B:   {P: 5479.0, e: 0.2, i: 143.0, Omega: 277.0}
  Bt:  {a: 35.0, e: 0.28, i: 143.0, Omega: 277.0, omega: 91.0}
  out: {a: 1400.0, e: 0.3, i: 60.0}
stars:
  m1: {R: 0.6}
  m2: {R: 0.4}
  m3: {R: 1.2}
  m4: {R: 1.0}
  m5: {R: 1.63, Teff: 3700}
physics: {gr: false}
run: {t_max_yr: 20000, n_output: 2001}
ensemble:
  n: 500
  seed: 1999
  directions: [forward]
  vary:
    orbits.Bt.a: {uniform: [34.0, 60.0]}
    orbits.Bt.e: {uniform: [0.1, 0.44]}
    orbits.Bt.M0: angle
    orbits.B.P: {uniform: [4383.0, 6575.0]}
    orbits.B.e: {uniform: [0.0, 0.5]}
    orbits.B.i: isotropic
    orbits.B.Omega: angle
    orbits.B.omega: angle
    orbits.B.M0: angle
    orbits.A.a: {uniform: [150.0, 300.0]}
    orbits.A.i: isotropic
    orbits.A.Omega: angle
    orbits.out.a: {loguniform: [1000.0, 3000.0]}
    orbits.out.e: {uniform: [0.0, 0.6]}
    orbits.out.i: isotropic
    orbits.out.Omega: angle
    orbits.out.M0: angle
