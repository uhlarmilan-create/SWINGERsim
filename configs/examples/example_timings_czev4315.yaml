# Synthetic eclipse timings of a CzeV4315-like 2+2 (swingersim timings): one possible mutual orbit
# (P_out = 120 d near the 119-d ETV signal; e_out, the orientation and the node of B are
# illustrative, not fitted).
#   swingersim timings configs/examples/example_timings_czev4315.yaml --years 5 \
#     -o output/timings_czev4315.csv --plot output/timings_czev4315.png
topology: 2+2
masses:
  m1: 2.4
  m2: 2.09
  m3: 2.3
  m4: 2.35
orbits:
  A:
    P: 6.73907
    e: 0.64
    i: 87.44
    Omega: 0.0
  B:
    P: 0.9193238
    e: 0.0
    i: 63.4
    Omega: 150.0
  out:
    P: 120.0
    e: 0.3
    i: 80.0
    Omega: 60.0
stars:
  m1:
    R: 1.73
  m2:
    R: 1.63
  m3:
    R: 1.83
  m4:
    R: 1.81
physics:
  gr: true
  tides: true
run:
  t_max_yr: 5
  backend: nbody
